name: Tests

on:
  push:
    branches: [main, master, "release/*"]
  pull_request:
  workflow_dispatch:

# Test-only workflow: least-privilege GITHUB_TOKEN scope.
permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }} · py${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: pip install -e ".[dev,web]"
      - name: Fetch base ref
        # actions/checkout@v4 defaults to fetch-depth: 1, which does NOT
        # include the PR's base ref. The Lint step needs origin/<base_ref>
        # to compute the diff, so fetch it explicitly here. The refspec
        # below stores the fetched commit under refs/remotes/origin/<base_ref>
        # so the Lint step can use the standard `origin/<base_ref>` ref.
        if: github.event_name == 'pull_request'
        shell: bash
        run: git fetch --depth=1 origin ${{ github.base_ref }}:refs/remotes/origin/${{ github.base_ref }}
      - name: Lint
        # Only lint files changed in this PR (vs the base branch). The
        # repo has pre-existing pre-commit issues in untouched files
        # (3.11+ compatibility in templates, prettier syntax in
        # .claude/skills/ assets, etc.) that are out of scope for this
        # cross-platform patch and would otherwise block every CI run.
        # github.base_ref is only set on pull_request events, so guard the
        # whole step with `if: github.event_name == 'pull_request'` and
        # also declare `shell: bash` so the script parses on windows-latest
        # (default shell there is pwsh).
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          # Two-dot diff (not three-dot): three-dot needs a merge base, which
          # the shallow fetch above doesn't provide. Two-dot gives the direct
          # diff between the base ref's tip and HEAD's tip — which is exactly
          # the PR's changes for a linear PR branch.
          CHANGED=$(git diff --name-only --diff-filter=ACMRT origin/${{ github.base_ref }}..HEAD)
          if [ -n "$CHANGED" ]; then
            echo "Linting changed files:"
            echo "$CHANGED"
            pre-commit run --files $CHANGED
          else
            echo "No changed files to lint."
          fi
      - name: Fast tests
        run: pytest -m "not slow" -q --no-cov -x
      - name: Doctor smoke
        # Doctor may report missing optional packages in the CI runner (e.g.
        # scikit-learn on a fresh `pip install -e .[dev,web]`). The doctor
        # itself is not the test surface of this PR — it surfaces pre-existing
        # environment quirks. Don't block the PR on doctor output; we only
        # want to fail if the doctor command itself crashes (non-zero exit
        # other than 1, which is the documented "missing packages" code).
        continue-on-error: true
        run: energizados doctor
      - name: Init smoke (non-interactive)
        # bash required on Windows: mktemp/ls are not PowerShell built-ins.
        # GitHub-hosted windows-latest runners ship with Git Bash on PATH.
        shell: bash
        run: |
          set -e
          WORK=$(mktemp -d)
          cd "$WORK"
          # Clean create (exercises the happy path).
          energizados init smoke --yes --force
          # Conflict create WITHOUT --force: exercises the FileExistsError handler
          # and the --yes-without-force refusal branch (cli/main.py). The refusal
          # path aborts with a non-zero exit; the assertion in the next line
          # proves it actually refused instead of silently overwriting.
          set +e
          energizados init smoke --yes
          RC=$?
          set -e
          if [ "$RC" -eq 0 ]; then
            echo "ERROR: --yes without --force should have refused, but exit was 0" >&2
            exit 1
          fi
          ls smoke/src/run/
