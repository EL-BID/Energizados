name: Release

on:
  push:
    branches: [main]
    tags:
      - "v*" # Run when a version tag is pushed
  workflow_dispatch:
    inputs:
      release_type:
        description: "Release type"
        required: true
        default: "patch"
        type: choice
        options:
          - patch
          - minor
          - major

permissions:
  contents: write
  pull-requests: write
  statuses: write

jobs:
  # -----------------------------------------------------------------------
  # Case A: version tag pushed — publish GitHub Release from it
  # -----------------------------------------------------------------------
  tag-release:
    name: Publish Release from Tag
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ github.ref }}
          generate_release_notes: true
          body: |
            See the [CHANGELOG](https://github.com/${{ github.repository }}/blob/main/CHANGELOG.md) for details.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # -----------------------------------------------------------------------
  # Case B: manual dispatch — bump version, update changelog, tag & push
  # -----------------------------------------------------------------------
  manual-release:
    name: Manual Release (${{ inputs.release_type }})
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      # ---- Bump version ----------------------------------------------------
      - name: Bump version
        run: python .github/scripts/bump_version.py --type ${{ inputs.release_type }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract new version
        run: |
          NEW_VERSION=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])")
          echo "version=$NEW_VERSION" >> "$GITHUB_OUTPUT"
          echo "New version: $NEW_VERSION"

      - name: Tag and commit
        run: |
          git add pyproject.toml CHANGELOG.md src/energizados/_version.py
          if git diff --staged --quiet; then
            echo "No files changed — nothing to release."
            exit 0
          fi
          git commit -m "chore(release): ${{ env.version }}"
          git tag "v${{ env.version }}"
          git push --follow-tags origin main

  # -----------------------------------------------------------------------
  # CI changelog: update [Unreleased] on every push to main (non-tag)
  # -----------------------------------------------------------------------
  changelog:
    name: Update Changelog
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && !startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Update unreleased changelog
        run: python .github/scripts/update_changelog.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Push changelog update
        run: |
          git add CHANGELOG.md
          if git diff --staged --quiet; then
            echo "No changelog changes — skipping."
          else
            git commit -m "docs(changelog): update unreleased section"
            git push origin main
          fi
