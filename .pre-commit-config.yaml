default_language_version:
  # Use the Python version the CI matrix installs (currently 3.10-3.12);
  # previously `python3.10` failed in 3.11/3.12 jobs with
  # "failed to find interpreter for Builtin discover of python_spec='python3.10'".
  python: python3

repos:
  - repo: https://github.com/pycqa/isort
    rev: 9.0.0a3
    hooks:
      - id: isort
        args: ["--profile", "black", "--filter-files"]
        # Templates are user-editable skeletons, not source files imported by
        # the framework. isort's first-party detection heuristic classifies
        # `from energizados...` differently depending on the file's path and
        # the host OS, which produces spurious "Fixing ..." failures on
        # Windows CI. Black and flake8 still lint .tpl files; only isort is
        # excluded here.
        exclude: \.tpl$

  - repo: https://github.com/psf/black
    rev: 26.5.1
    hooks:
      - id: black

  - repo: https://github.com/PyCQA/bandit
    rev: 1.9.4
    hooks:
      - id: bandit
        args:
          - -c
          - .code_quality/bandit.yaml

  - repo: https://github.com/pycqa/flake8
    rev: 7.3.0
    hooks:
      - id: flake8
        args:
          - --config=.code_quality/.flake8

  # yaml formatting
  - repo: https://github.com/pre-commit/mirrors-prettier
    rev: v4.0.0-alpha.8
    hooks:
      - id: prettier
        types: [yaml]
