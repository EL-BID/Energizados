{% extends "base.html" %}

{% block content %}
<div class="row g-4">
    <div class="col-md-6">
        {% include "components/editor.html" %}
    </div>

    <div class="col-md-6">
        <div id="validation-output">
            <div class="app-empty">
                ℹ️ Submit a configuration to see validation results
            </div>
        </div>
    </div>
</div>

<!-- Job List Section -->
<section class="mt-4">
    <div id="job-list-container">
        <section class="app-card mb-0">
            <div class="app-card__header">
                <h2 class="app-card__title app-card__title--sm">📋 Job List</h2>
            </div>
            <div class="app-empty">
                Loading jobs...
            </div>
        </section>
    </div>
</section>
{% endblock %}

{% block extra_scripts %}
<script>
    // Load job list via HTMX on page load
    document.addEventListener('DOMContentLoaded', function() {
        setTimeout(function() {
            htmx.ajax('get', '/jobs', {target: '#job-list-container'});
        }, 100);
    });
</script>
{% endblock %}
