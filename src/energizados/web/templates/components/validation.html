{% macro validation_errors(errors) -%}
{% if errors %}
<div class="validation-errors" id="validation-errors">
    <h5 class="text-danger mb-3">❌ Configuration Validation Errors</h5>
    <ul class="mb-0">
        {% for error in errors %}
        <li class="text-danger">{{ error }}</li>
        {% endfor %}
    </ul>
</div>
{% else %}
<div class="alert alert-success" id="validation-success">
    ✅ Configuration is valid
</div>
{% endif %}
{%- endmacro %}
