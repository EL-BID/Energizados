# OpenSpec Configuration for Energizados
schema: spec-driven

context: |
  Tech stack: Python 3.10+ ML framework for electricity theft detection
  Architecture: Modular pipeline with ETL, preprocessing, feature engineering, modeling, evaluation
  Testing: pytest with pytest-cov, markers for unit/slow/integration
  Style: Black (100 chars), Ruff, isort, mypy, pre-commit hooks
  CLI: Click-based energizados CLI for pipeline orchestration
  Config: YAML-based configuration (etl.yaml, train.yaml, infer.yaml)

strict_tdd: true

rules:
  proposal:
    - Include rollback plan for risky changes to ML pipeline
    - Identify affected ETLs, preprocessing steps, and model configurations
    - Consider backward compatibility for saved models (.pkl files)
  specs:
    - Use Given/When/Then format for scenarios
    - Use RFC 2119 keywords (MUST, SHALL, SHOULD, MAY)
    - Document expected input/output schema changes
  design:
    - Include sequence diagrams for complex data flows (ETL → preprocessing → training)
    - Document architecture decisions with rationale in ADR format
    - Consider impact on existing experiment configurations
  tasks:
    - Group tasks by phase (infrastructure, preprocessing, modeling, testing)
    - Use hierarchical numbering (1.1, 1.2, etc.)
    - Keep tasks small enough to complete in one session
    - Separate ETL changes from model training changes
  apply:
    - Follow existing code patterns (BaseETL, BaseFeatureEngineering, BaseModel adapters)
    - Use Python logging module, never print statements
    - Ensure pre-commit hooks pass before committing
    - Update CLAUDE.md if architectural patterns change
  verify:
    - Run pytest tests/ if test infrastructure exists
    - Run pre-commit run --all-files for linting/formatting
    - Compare implementation against every spec scenario
    - Validate with energizados validate etl,train for config changes
  archive:
    - Warn before merging destructive deltas (large removals)
    - Update CHANGELOG.md following Keep a Changelog format
    - Use Conventional Commits for all commit messages

testing:
  strict_tdd_mode: enabled
  detected: 2025-01-25

  test_runner:
    command: pytest tests/
    framework: pytest

  test_layers:
    unit:
      available: true
      tool: pytest
    integration:
      available: true
      tool: pytest (marked with @pytest.mark.integration)
    e2e:
      available: true
      tool: pytest (test_e2e_pipeline.py)

  coverage:
    available: true
    command: pytest --cov=energizados --cov-report=term-missing --cov-report=html

  quality_tools:
    linter:
      available: true
      command: ruff check src/ && flake8 --config=.code_quality/.flake8
    type_checker:
      available: true
      command: mypy src/
    formatter:
      available: true
      command: black src/ tests/ && isort --profile black --filter-files

  pre_commit:
    available: true
    hooks:
      - isort
      - black
      - bandit
      - flake8
      - prettier (yaml)
