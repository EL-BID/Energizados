# OpenSpec SDD Configuration — energizados
# Generated by sdd-init
schema: spec-driven

context: |
  Tech stack: Python 3.10, setuptools/pyproject.toml, `pip install -e ".[dev]"`
  CLI: `energizados` (click-based, entry: src/energizados/cli/main.py:cli)
  Architecture: ML framework for electricity-theft detection — rule-based + supervised models
    (LightGBM, CatBoost, XGBoost, Neural Networks, LSTM) + Isolation Forest anomaly scoring.
    ETL system with YAML-configurable pipeline, multi-ETL dependency DAG orchestrator.
    EDA module with interactive HTML reports. ConfigPipelineBuilder orchestrator.
  Testing: pytest (strict-config, strict-markers), pytest-cov, tests/ directory with ~39 test files
    covering unit, integration, and E2E layers. Pre-commit: isort, black, bandit, flake8, prettier.
  Conventions: Conventional Commits (feat/fix/refactor/test/docs/chore), 
    Keep a Changelog, Semantic Versioning.
    NO AI attribution in commits. Spanish feature names, English class/method names.
    Python logging module (not print).
  Code quality: ruff (E, F, I, N, W), mypy, black (line-length=100), isort (profile=black)

strict_tdd: true

testing:
  runner: pytest
  command: pytest tests/
  layers:
    unit: true
    integration: true
    e2e: true
  coverage: true
  coverage_command: pytest --cov=energizados --cov-report=term-missing --cov-report=html
  quality:
    linter: ruff (select E,F,I,N,W)
    type_checker: mypy
    formatter: black + isort
  pre_commit: true

rules:
  proposal:
    - Include rollback plan for risky changes
    - State impact on existing experiments and models
  specs:
    - Use Given/When/Then for scenarios
    - Use RFC 2119 keywords (MUST, SHALL, SHOULD, MAY)
  design:
    - Include sequence diagrams for complex flows
    - Document architecture decisions with rationale
  tasks:
    - Group by phase, use hierarchical numbering
    - Keep tasks completable in one session
  apply:
    tdd: true
    test_command: "pytest tests/"
    pre_commit: "pre-commit run --all-files"
    patterns:
      - Follow existing code patterns (Spanish feature names / English class names)
  verify:
    test_command: "pytest tests/ -x"
    build_command: "pip install -e ."
    coverage_threshold: 70
  archive:
    - Warn before merging destructive deltas
